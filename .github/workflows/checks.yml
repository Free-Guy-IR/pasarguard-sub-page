name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    name: render matrix and translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Jinja2
        run: pip install jinja2==3.1.6

      - name: Render matrix
        run: python tests/test_render_matrix.py

      - name: Translations
        run: python tests/test_i18n.py

      - name: Escaping
        run: python tests/test_escaping.py

  deploy-script:
    name: deploy script self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Deploy script self-test
        run: bash tools/deploy_selftest.sh

      - name: Workflow policy
        run: bash tools/check_workflows.sh

  installer:
    name: installer self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository with its full history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer self-test
        run: bash test-install.sh ./install.sh

  browser:
    name: browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Jinja2
        run: pip install jinja2==3.1.6

      - name: Locate Chrome
        run: python -c "import sys; sys.path.insert(0, 'tests'); import cdp; b = cdp.find_chrome(); print(b or 'no chrome or chromium binary on this runner'); sys.exit(0 if b else 1)"

      - name: Browser fixtures
        run: python tests/test_browser.py

  layout:
    name: responsive layout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install Jinja2
        run: pip install jinja2==3.1.6

      - name: Locate Chrome
        run: python -c "import sys; sys.path.insert(0, 'tests'); import cdp; b = cdp.find_chrome(); print(b or 'no chrome or chromium binary on this runner'); sys.exit(0 if b else 1)"

      - name: Layout across locales and widths
        run: python tests/test_layout.py
